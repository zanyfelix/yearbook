# ===============================================
# DEVELOPMENT PROFILE (개발용)
# ===============================================

# 서버 포트
server.port=9080

# 개발용 로컬 DB 설정
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/yearbook?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root!23

# JPA 설정 (개발 시 스키마 자동 업데이트, SQL 로그 출력)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 파일 업로드 경로 (개발용 로컬 PC 경로)
file.path.theme=E:/data/theme/
file.path.upload=E:/data/upload/
file.path.thumbnail=E:/data/thumbnail/

# 로그 레벨 (개발 시 상세 로그 확인)
logging.level.root=INFO
logging.level.com.mbiz.yearbook=DEBUG