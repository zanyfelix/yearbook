# ===============================================
# PRODUCTION PROFILE (운영용)
# ===============================================

# 서버 포트 (일반적인 웹 서비스 포트)
server.port=8080

# 운영용 실제 DB 설정
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/yearbook?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root!23

# JPA 설정 (운영 시 스키마 자동 변경 비활성화)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 파일 업로드 경로 (운영 서버의 실제 경로)
file.path.theme=/app/data/theme/
file.path.upload=/app/data/upload/
file.path.thumbnail=/data/app/thumbnail/

# 로그 경로 설정
logging.file.path=/app/data/logs
# 로그 레벨 (운영 시에는 INFO 레벨로 설정)
logging.level.root=INFO

# Yearbook 렌더링 관련 경로 (운영 서버 기준)
yearbook.temp.path=/app/data/yearbook/temp
yearbook.output.path=/app/data/yearbook/output
yearbook.cache.path=/app/data/yearbook/cache