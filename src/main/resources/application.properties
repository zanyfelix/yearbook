# ===============================================
# COMMON CONFIGURATION (공통 설정)
# ===============================================

#--- 기본 활성 프로파일 지정 (이 값을 'prod'로 바꾸면 운영용 설정이 기본이 됨) ---
spring.profiles.active=dev


#--- 아래는 개발/운영 환경에 모두 공통으로 적용되는 설정입니다 ---

# JPA 공통 설정
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JSP 설정
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 정적 자원 설정
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# 파일 업로드 공통 설정
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-swallow-size=200MB

# 리소스 체인 및 캐시 설정
spring.web.resources.chain.enabled=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.cache.period=31536000

# Yearbook 렌더링 공통 설정
yearbook.render.max-width=2621
yearbook.render.max-height=3371
yearbook.render.dpi=300
yearbook.render.quality=0.95

# 비동기 처리 설정
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=render-

# 캐싱 설정
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=30m

# 세션 및 요청 타임아웃
server.servlet.session.timeout=1800
spring.mvc.async.request-timeout=600000

# EMAIL SMTP SERVER CONFIGURATION
spring.mail.host=smtp.worksmobile.com
spring.mail.port=587
spring.mail.username=support@capturecord.com
spring.mail.password=3IaExjFQjH9T
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

server.connection-timeout=120000

# Impersonate 설정
impersonate.enabled=true
impersonate.token.timeout=30
impersonate.session.timeout=1800
impersonate.audit.enabled=true