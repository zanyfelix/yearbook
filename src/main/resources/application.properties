server.port = 9080
# MySQL 연결 설정
#spring.datasource.url=jdbc:mysql://121.78.128.144:3306/yearbook?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/yearbook?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=admin
#spring.datasource.password=admin!23
spring.datasource.username=root
spring.datasource.password=root!23

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JSP 설정 (유지)
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 정적 자원
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# 파일 업로드 설정
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-swallow-size=200MB

# 리소스 체인 활성화
spring.web.resources.chain.enabled=true
# 컨텐츠 해시 기반 버전 전략
spring.web.resources.chain.strategy.content.enabled=true
# 정적 리소스 캐시 (초 단위, 예: 365일)
spring.web.resources.cache.period=31536000

file.upload-dir=D:/uploads/

# Yearbook 렌더링 설정
yearbook.upload.path=/var/yearbook/uploads
yearbook.temp.path=/var/yearbook/temp
yearbook.output.path=/var/yearbook/output
yearbook.cache.path=/var/yearbook/cache

# 렌더링 설정
yearbook.render.max-width=2621
yearbook.render.max-height=3371
yearbook.render.dpi=300
yearbook.render.quality=0.95

# 비동기 처리 설정
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=render-

# 캐싱 설정 (선택사항)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=30m

# 세션타임
server.servlet.session.timeout=30m
spring.mvc.async.request-timeout=300000

# 로그 경로 설정
logging.file.path=/var/log/yearbook
logging.level.root=INFO

# SQL 로깅 활성화
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

