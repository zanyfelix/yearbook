# MySQL 연결 설정
#spring.datasource.url=jdbc:mysql://121.78.128.144:3306/yearbook?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/yearbook?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=admin
#spring.datasource.password=admin!23
spring.datasource.username=root
spring.datasource.password=root!23

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JSP 설정 (유지)
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 정적 자원
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 리소스 체인 활성화
spring.web.resources.chain.enabled=true
# 컨텐츠 해시 기반 버전 전략
spring.web.resources.chain.strategy.content.enabled=true
# 정적 리소스 캐시 (초 단위, 예: 365일)
spring.web.resources.cache.period=31536000

file.upload-dir=D:/uploads/